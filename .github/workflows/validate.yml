name: Validate

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php: ['7.4', '8.2']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
          coverage: none

      - name: Validate PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          find . -path './.git' -prune -o -path './vendor' -prune -o -path './build' -prune -o -path './dist' -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          if find assets -name '*.js' -print -quit | grep -q .; then
            find assets -name '*.js' -print0 | xargs -0 -n1 node --check
          fi
